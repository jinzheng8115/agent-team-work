<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Worker-to-Worker 回合对话生命周期</title>
  <desc id="desc">Lead 批准有界讨论，参与者读取共享 transcript 后进行真实 peer exchange，decision owner 汇总结论，Lead 核验后继续串行流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173b5f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#173b5f"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #173b5f; }
      .subtitle { font: 500 20px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #49677d; }
      .card-title { font: 700 25px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #173b5f; }
      .body { font: 500 18px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #254b64; }
      .small { font: 500 16px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #315a70; }
      .step { font: 700 22px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .peer { font: 700 17px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #173b5f; text-anchor: middle; }
      .note { font: 700 20px 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #173b5f; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f7f1e6"/>
  <text x="700" y="62" class="title" text-anchor="middle">Worker-to-Worker 回合对话</text>
  <text x="700" y="98" class="subtitle" text-anchor="middle">有界讨论支撑一个决定，不改变串行派单与 Lead 验收门</text>

  <!-- connectors behind cards -->
  <path d="M 310 240 H 400" stroke="#173b5f" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 240 H 770" stroke="#173b5f" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1050 400 V 480" stroke="#173b5f" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 670 590 H 800" stroke="#173b5f" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- step 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="240" height="190" rx="24" fill="#ef896d" stroke="#173b5f" stroke-width="3"/>
  </g>
  <circle cx="108" cy="184" r="25" fill="#173b5f"/>
  <text x="108" y="184" class="step">1</text>
  <text x="105" y="238" class="card-title">Lead 批准</text>
  <text x="105" y="273" class="body">范围 · participants</text>
  <text x="105" y="301" class="body">decision owner · 轮数上限</text>

  <!-- step 2 -->
  <g filter="url(#shadow)">
    <rect x="400" y="145" width="280" height="190" rx="24" fill="#74c2dc" stroke="#173b5f" stroke-width="3"/>
  </g>
  <circle cx="438" cy="184" r="25" fill="#173b5f"/>
  <text x="438" y="184" class="step">2</text>
  <text x="435" y="238" class="card-title">共享 transcript</text>
  <text x="435" y="273" class="body">统一 context 与记录路径</text>
  <text x="435" y="301" class="body">所有参与者先读同一份证据</text>

  <!-- step 3 -->
  <g filter="url(#shadow)">
    <rect x="770" y="120" width="560" height="280" rx="24" fill="#c7b5e3" stroke="#173b5f" stroke-width="3"/>
  </g>
  <circle cx="810" cy="160" r="25" fill="#173b5f"/>
  <text x="810" y="160" class="step">3</text>
  <text x="850" y="166" class="card-title">Worker 之间真实 peer exchange</text>
  <text x="850" y="198" class="small">消息必须可见、身份绑定，recipients 明确指向 peer</text>
  <line x1="850" y1="290" x2="1250" y2="290" stroke="#173b5f" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <circle cx="900" cy="270" r="42" fill="#f7f1e6" stroke="#173b5f" stroke-width="3"/>
  <circle cx="1050" cy="270" r="42" fill="#f7f1e6" stroke="#173b5f" stroke-width="3"/>
  <circle cx="1200" cy="270" r="42" fill="#f7f1e6" stroke="#173b5f" stroke-width="3"/>
  <text x="900" y="278" class="peer">architect</text>
  <text x="1050" y="278" class="peer">backend</text>
  <text x="1200" y="278" class="peer">reviewer</text>
  <text x="1050" y="352" class="small" text-anchor="middle">不是 Lead 私下征询，也不是自由聊天</text>

  <!-- step 4 -->
  <g filter="url(#shadow)">
    <rect x="370" y="480" width="300" height="200" rx="24" fill="#f2c56f" stroke="#173b5f" stroke-width="3"/>
  </g>
  <circle cx="408" cy="519" r="25" fill="#173b5f"/>
  <text x="408" y="519" class="step">4</text>
  <text x="445" y="525" class="card-title">decision owner 汇总</text>
  <text x="405" y="575" class="body">只能在 cross-worker</text>
  <text x="405" y="603" class="body">exchange 完成后给出结论</text>
  <text x="405" y="646" class="small">选择方案 · 记录依据 · 标注分歧</text>

  <!-- step 5 -->
  <g filter="url(#shadow)">
    <rect x="800" y="480" width="320" height="200" rx="24" fill="#69b7a8" stroke="#173b5f" stroke-width="3"/>
  </g>
  <circle cx="838" cy="519" r="25" fill="#173b5f"/>
  <text x="838" y="519" class="step">5</text>
  <text x="875" y="525" class="card-title">Lead 核验并采纳</text>
  <text x="835" y="575" class="body">核验可见性、身份、证据</text>
  <text x="835" y="603" class="body">和范围后才接受决定</text>
  <text x="835" y="646" class="small">通过后继续当前阶段流程</text>

  <!-- invariant note -->
  <rect x="150" y="755" width="1100" height="74" rx="20" fill="#f7f1e6" stroke="#173b5f" stroke-width="4"/>
  <text x="700" y="801" class="note">讨论是当前阶段内的子流程：有界、可恢复、可审计，不替代 Lead 验收</text>
</svg>
